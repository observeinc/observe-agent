# Upstream changes that behave differently, or change output, for user configuration. The agent
# warns at startup and in `observe-agent config validate` for every component an entry matches; it
# never changes the configuration. Messages announce the change before the release that delivers it
# (Phase 1) and say what changed from that release until remove_in (Phase 2).
#
# Each entry:
#   id:         unique name.
#   kind:       receiver, processor, exporter, connector or extension.
#   types:      component types the entry applies to, including deprecated aliases.
#   upstream:   first OpenTelemetry Collector version with the change.
#   remove_in:  agent release that deletes the entry (Phase 3). CI fails once that release is tagged.
#   match:      omit to match every component of the types. Otherwise `check` names a Go check in
#               upcoming_changes.go, or `all` lists conditions on the component's configuration:
#               `path` (list of keys) with one of `equals: <value>`, `absent: true` (missing,
#               null or empty string) or `not_contains: <value>`.
#   message:    what changes and what to do.
#   examples:   component configurations that must and must not match; the tests run them.
#
# Shipped configuration must never match an entry (Test_BundledConfigHasNoUpcomingChanges), so
# match on component types or settings that shipped configuration doesn't use.

changes:
  - id: tail-sampling-invert-match
    kind: processor
    types: [tail_sampling]
    upstream: v0.152.0
    remove_in: v2.22.0
    match:
      check: tail_sampling_invert_match
    message: >-
      Changed in Observe Agent v2.20.0, which updates the OpenTelemetry Collector from v0.151.0 to
      v0.164.1: invert_match policies in tail_sampling no longer exclude traces that other policies
      sample, and not policies negate them (v0.152.0). This processor has a top-level invert_match
      policy next to other policies, or one inside a not policy, so the traces it samples changed.
      Replace those invert_match policies with drop policies:
      https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/tailsamplingprocessor
    examples:
      fires:
        - policies:
            - {name: errors, type: status_code, status_code: {status_codes: [ERROR]}}
            - {name: no-healthz, type: string_attribute, string_attribute: {key: http.target, values: [/healthz], invert_match: true}}
        - policies:
            - {name: no-healthz, type: string_attribute, string_attribute: {key: http.target, values: [/healthz], invert_match: true}}
            - {name: drop-debug, type: drop, drop: {drop_sub_policy: [{name: debug, type: boolean_attribute, boolean_attribute: {key: debug, value: true}}]}}
        - policies:
            - {name: not-healthz, type: not, not: {not_sub_policy: {name: no-healthz, type: string_attribute, string_attribute: {key: http.target, values: [/healthz], invert_match: true}}}}
      quiet:
        - policies:
            - {name: no-healthz, type: string_attribute, string_attribute: {key: http.target, values: [/healthz], invert_match: true}}
        - policies:
            - {name: errors, type: status_code, status_code: {status_codes: [ERROR]}}
        - policies:
            - {name: not-healthz, type: not, not: {not_sub_policy: {name: healthz, type: string_attribute, string_attribute: {key: http.target, values: [/healthz]}}}}

  - id: httpcheck-nanoseconds
    kind: receiver
    types: [http_check, httpcheck]
    upstream: v0.153.0
    remove_in: v2.22.0
    message: >-
      Changed in Observe Agent v2.20.0, which updates the OpenTelemetry Collector from v0.151.0 to
      v0.164.1: the httpcheck timing metrics (httpcheck.dns.lookup.duration,
      httpcheck.client.connection.duration, httpcheck.tls.handshake.duration,
      httpcheck.client.request.duration, httpcheck.response.duration) report nanoseconds instead of
      milliseconds (v0.153.0), so their values are 1,000,000 times larger. Update dashboards and
      monitors that use them. Details:
      https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/CHANGELOG.md
    examples:
      fires:
        - {}

  - id: mongodb-output
    kind: receiver
    types: [mongodb]
    upstream: v0.155.0
    remove_in: v2.22.0
    message: >-
      Changed in Observe Agent v2.20.0, which updates the OpenTelemetry Collector from v0.151.0 to
      v0.164.1: the mongodb receiver requires MongoDB 4.4 or later (v0.155.0), its metric units
      follow UCUM (v0.157.0), and mongodb.operation.latency.time is a cumulative sum instead of a
      gauge (v0.164.0). Update dashboards and monitors that use these metrics. Details:
      https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/CHANGELOG.md
    examples:
      fires:
        - {}

  - id: sqlserver-output
    kind: receiver
    types: [sql_server, sqlserver]
    upstream: v0.157.0
    remove_in: v2.22.0
    message: >-
      Changed in Observe Agent v2.20.0, which updates the OpenTelemetry Collector from v0.151.0 to
      v0.164.1: the sqlserver receiver's metric units follow UCUM, and sqlserver.lock.timeout.rate,
      if enabled, reports one data point per sqlserver.lock.timeout.type (v0.157.0); server.address
      and server.port are resource attributes enabled by default and are no longer
      db.server.top_query log attributes (v0.161.0); on direct database connections, counters from
      the Databases object carry sqlserver.database.name and the unlabeled _Total series is gone, so
      sqlserver.database.backup_or_restore.rate is split per database (v0.163.0). Update dashboards
      and monitors that use these metrics. Details:
      https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/CHANGELOG.md
    examples:
      fires:
        - {}

  - id: postgresql-locks
    kind: receiver
    types: [postgresql]
    upstream: v0.158.0
    remove_in: v2.22.0
    message: >-
      Changed in Observe Agent v2.20.0, which updates the OpenTelemetry Collector from v0.151.0 to
      v0.164.1: the postgresql receiver collects postgresql.database.locks from every configured
      database instead of only the postgres database (v0.158.0). Update dashboards and monitors that
      use this metric. Details:
      https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/CHANGELOG.md
    examples:
      fires:
        - {}

  - id: hostmetrics-cpu-attribute
    kind: receiver
    types: [host_metrics, hostmetrics]
    upstream: v0.157.0
    remove_in: v2.22.0
    match:
      check: hostmetrics_cpu_attribute
    message: >-
      Changed in Observe Agent v2.20.0, which updates the OpenTelemetry Collector from v0.151.0 to
      v0.164.1: the hostmetrics CPU scraper reports system.cpu.time and system.cpu.utilization
      without the cpu attribute unless it is listed (v0.157.0), so per-CPU series are combined. To
      get them back, set attributes: [cpu, state] on system.cpu.time, and on system.cpu.utilization
      if it is enabled. Details:
      https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/CHANGELOG.md
    examples:
      fires:
        - scrapers: {cpu: null}
        - scrapers:
            cpu:
              metrics:
                system.cpu.time: {attributes: [cpu, state]}
                system.cpu.utilization: {enabled: true}
      quiet:
        - scrapers:
            cpu:
              metrics:
                system.cpu.time: {attributes: [cpu, state]}
        - scrapers:
            cpu:
              metrics:
                system.cpu.time: {enabled: false}
        - scrapers: {memory: null}

  - id: prometheus-exporter-suffixes
    kind: exporter
    types: [prometheus]
    upstream: v0.154.0
    remove_in: v2.22.0
    match:
      all:
        - {path: [add_metric_suffixes], equals: false}
        - {path: [translation_strategy], absent: true}
    message: >-
      Changed in Observe Agent v2.20.0, which updates the OpenTelemetry Collector from v0.151.0 to
      v0.164.1: the prometheus exporter ignores add_metric_suffixes and adds type and unit suffixes,
      such as _total, to metric names (v0.154.0). To drop the suffixes, replace add_metric_suffixes:
      false with translation_strategy: UnderscoreEscapingWithoutSuffixes. Details:
      https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/CHANGELOG.md
    examples:
      fires:
        - {add_metric_suffixes: false}
        - {add_metric_suffixes: false, translation_strategy: ""}
      quiet:
        - {add_metric_suffixes: false, translation_strategy: UnderscoreEscapingWithoutSuffixes}
        - {add_metric_suffixes: true}
        - {}
