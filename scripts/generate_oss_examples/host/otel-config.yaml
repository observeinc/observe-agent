# Merged on top of the agent's bundled configuration when generating
# examples/oss-collector/collector/host.yaml. Values written as "$${env:VAR}" appear in host.yaml as
# "${env:VAR}", so the example reads them from the collector's environment at startup:
#   OBSERVE_COLLECTION_URL  Your collection URL, e.g. https://123456789012.collect.observeinc.com
#   OBSERVE_TOKEN           An Observe ingest token
exporters:
  otlphttp/observe:
    endpoint: $${env:OBSERVE_COLLECTION_URL}/v2/otel
    headers:
      authorization: Bearer $${env:OBSERVE_TOKEN}
  otlphttp/observemetrics:
    endpoint: $${env:OBSERVE_COLLECTION_URL}/v2/otel
    headers:
      authorization: Bearer $${env:OBSERVE_TOKEN}
  otlphttp/observetracing:
    endpoint: $${env:OBSERVE_COLLECTION_URL}/v2/otel
    headers:
      authorization: Bearer $${env:OBSERVE_TOKEN}
  prometheusremotewrite/observe:
    endpoint: $${env:OBSERVE_COLLECTION_URL}/v1/prometheus
    headers:
      authorization: Bearer $${env:OBSERVE_TOKEN}
extensions:
  # Persists filelog read positions across restarts, in otelcol-contrib's directory rather than the
  # Observe Agent's.
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
