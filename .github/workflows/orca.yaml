name: SAST, SCA & Image Scan Workflow

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  orca-scan:
    name: Orca Scan
    runs-on: ubuntu-latest
    env:
      PROJECT_KEY: observeinc-observe-agent
      # Mapped from the secret so the steps below can be skipped when it is
      # absent (e.g. pull requests from forks, which do not receive secrets).
      # The `secrets` context is not available in a step `if`, but `env` is.
      ORCA_SECURITY_API_TOKEN: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Orca SAST Scan
        if: ${{ env.ORCA_SECURITY_API_TOKEN != '' }}
        uses: orcasecurity/shiftleft-sast-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.PROJECT_KEY }}
          path: "."
          exclude_paths: "vendor,internal/agentresource/agentresource.go"

      - name: Run Orca FS Scan
        if: ${{ env.ORCA_SECURITY_API_TOKEN != '' }}
        uses: orcasecurity/shiftleft-fs-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.PROJECT_KEY }}
          path: "."
          exclude_paths: "vendor,components/processors/observek8sattributesprocessor/testdata"

  orca-container-scan:
    name: Orca Container Image Scan
    runs-on: ubuntu-observe-agent-8cpu
    # Skip on pull requests: this job builds release artifacts (GoReleaser +
    # full Docker image), which we don't want to run on PRs. It still runs on
    # push to main, the weekly schedule, and manual dispatch. The lightweight
    # SAST/FS scans above provide PR coverage.
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
    env:
      PROJECT_KEY: observeinc-observe-agent
      TEST_TAG: observeinc/observe-agent:test
      ORCA_SECURITY_API_TOKEN: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.8
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: 2.14.1
          args: build --snapshot --id=linux_build --skip=validate --single-target
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Copy Binary
        run: |
          cp dist/linux_amd64/linux_build_linux_amd64_v1/observe-agent .

      - name: Build Docker Image Locally
        run: docker build --build-arg TARGETPLATFORM=. -f packaging/docker/Dockerfile -t ${{ env.TEST_TAG }} .

      - name: Run Orca Container Image Scan
        if: ${{ env.ORCA_SECURITY_API_TOKEN != '' }}
        uses: orcasecurity/shiftleft-container-image-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.PROJECT_KEY }}
          image: ${{ env.TEST_TAG }}
