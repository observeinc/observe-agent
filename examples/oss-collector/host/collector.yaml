# Set these environment variables before starting the collector:
#   OBSERVE_COLLECTION_URL  Your collection URL, e.g. https://123456789012.collect.observeinc.com
#   OBSERVE_TOKEN           An Observe ingest token
#   DEPLOYMENT_ENVIRONMENT  Fallback deployment.environment.name for telemetry that does not set one
connectors:
  spanmetrics:
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    dimensions:
      - name: service.namespace
      - name: service.version
      - name: deployment.environment.name
      - name: host.name
      - name: peer.db.name
      - name: peer.messaging.system
      - name: otel.status_description
      - name: observe.status_code
    histogram:
      exponential:
        max_size: 100
    resource_metrics_key_attributes:
      - service.name
      - service.namespace
      - service.version
      - deployment.environment.name
      - host.name
  spanmetrics/summary:
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    dimensions:
      - name: service.namespace
      - name: service.version
      - name: deployment.environment.name
      - name: peer.db.name
      - name: peer.messaging.system
      - name: observe.status_code
    histogram:
      exponential:
        max_size: 100
    resource_metrics_key_attributes:
      - service.name
      - service.namespace
      - service.version
      - deployment.environment.name
exporters:
  otlphttp/observe:
    compression: zstd
    endpoint: ${env:OBSERVE_COLLECTION_URL}/v2/otel
    headers:
      authorization: Bearer ${env:OBSERVE_TOKEN}
      x-observe-target-package: Host Explorer
    retry_on_failure:
      enabled: true
    sending_queue:
      num_consumers: 4
      queue_size: 100
  otlphttp/observemetrics:
    compression: zstd
    endpoint: ${env:OBSERVE_COLLECTION_URL}/v2/otel
    headers:
      authorization: Bearer ${env:OBSERVE_TOKEN}
      x-observe-target-package: Metrics
    retry_on_failure:
      enabled: true
    sending_queue:
      num_consumers: 4
      queue_size: 100
  otlphttp/observetracing:
    compression: zstd
    endpoint: ${env:OBSERVE_COLLECTION_URL}/v2/otel
    headers:
      authorization: Bearer ${env:OBSERVE_TOKEN}
      x-observe-target-package: Tracing
    retry_on_failure:
      enabled: true
    sending_queue:
      num_consumers: 4
      queue_size: 100
  prometheusremotewrite/observe:
    endpoint: ${env:OBSERVE_COLLECTION_URL}/v1/prometheus
    headers:
      authorization: Bearer ${env:OBSERVE_TOKEN}
      x-observe-target-package: Host Explorer
    max_batch_request_parallelism: 5
    remote_write_queue:
      num_consumers: 5
    resource_to_telemetry_conversion:
      enabled: true
    send_metadata: true
    target_info:
      enabled: false
processors:
  batch:
    timeout: 5s
  deltatocumulative: null
  filter/drop_long_spans:
    error_mode: ignore
    traces:
      span:
        - (span.end_time - span.start_time) > Duration("1h")
  filter/drop_non_apm_spans:
    error_mode: ignore
    traces:
      span:
        - span.kind == SPAN_KIND_CLIENT and span.attributes["peer.db.name"] == nil and span.attributes["db.system.name"] == nil and span.attributes["db.system"] == nil
        - span.kind == SPAN_KIND_PRODUCER and span.attributes["peer.messaging.system"] == nil and span.attributes["messaging.system"] == nil
        - span.kind == SPAN_KIND_UNSPECIFIED
        - span.kind == SPAN_KIND_INTERNAL
  groupbyattrs/peers:
    keys:
      - peer.db.name
      - peer.messaging.system
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  metricstransform/rename_summary_metrics:
    transforms:
      - action: update
        include: traces.span.metrics.calls
        new_name: traces.span.metrics.calls.summary
      - action: update
        include: traces.span.metrics.duration
        new_name: traces.span.metrics.duration.summary
  resource/observe_global_resource_attributes:
