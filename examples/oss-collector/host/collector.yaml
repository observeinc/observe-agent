        - os
      resource_attributes:
        host.arch:
          enabled: true
        host.cpu.cache.l2.size:
          enabled: true
        host.cpu.family:
          enabled: true
        host.cpu.model.id:
          enabled: true
        host.cpu.model.name:
          enabled: true
        host.cpu.stepping:
          enabled: true
        host.cpu.vendor.id:
          enabled: true
        host.id:
          enabled: false
        host.name:
          enabled: true
        os.description:
          enabled: true
        os.type:
          enabled: true
  resourcedetection/cloud:
    detectors:
      - gcp
      - ecs
      - ec2
      - azure
